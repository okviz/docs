<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="title description">
    <title id="title">Synoptic Panel data flow and network connections</title>
    <desc id="description">Within the Power BI report viewer, Power BI sends report fields to Synoptic Panel and receives selections. Local maps and settings are stored in the report. The visual can contact the OKVIZ API, configured map and asset hosts, and My Storage.</desc>
    <!-- Power BI icon by Microsoft, CC BY 4.0: https://github.com/microsoft/PowerBI-Icons/blob/main/SVG/Power-BI.svg -->
    <defs>
        <linearGradient id="viewer-surface" x2="0" y2="1">
            <stop stop-color="#eef5fe" />
            <stop offset="1" stop-color="#f8faff" />
        </linearGradient>
        <linearGradient id="network-surface" x2="0" y2="1">
            <stop stop-color="#f2eefb" />
            <stop offset="1" stop-color="#fbf9fe" />
        </linearGradient>
        <marker id="report-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
            <path d="M0 0L10 5L0 10Z" fill="#496d9b" />
        </marker>
        <marker id="outbound-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
            <path d="M0 0L10 5L0 10Z" fill="#7354ac" />
        </marker>
    </defs>

    <rect x="1" y="1" width="678" height="358" rx="20" fill="#fff" stroke="#dde5ef" />
    <g font-family="Arial, Helvetica, sans-serif" fill="#172b45">
        <rect x="14" y="14" width="328" height="332" rx="16" fill="url(#viewer-surface)" stroke="#d4e2f3" />
        <text x="33" y="49" font-size="20" font-weight="700">Power BI report viewer</text>

        <g fill="#fff" stroke="#d6e1f0">
            <rect x="32" y="76" width="292" height="79" rx="12" />
            <rect x="32" y="240" width="292" height="79" rx="12" />
        </g>
        <rect x="46" y="94" width="44" height="44" rx="11" fill="#fff5ce" />
        <image x="51" y="99" width="34" height="34" href="data:image/svg+xml;base64," />
        <rect x="46" y="258" width="44" height="44" rx="11" fill="#ecf3ff" />
        <image x="49" y="261" width="38" height="38" href="data:image/svg+xml;base64," />

        <g font-size="19" font-weight="700">
            <text x="107" y="110">Power BI report</text>
            <text x="107" y="274">Synoptic Panel</text>
        </g>
        <g font-size="14" fill="#475971">
            <text x="107" y="133">Local maps and settings</text>
            <text x="107" y="297">Renders the map</text>
        </g>

        <g fill="none" stroke="#496d9b" stroke-width="2" marker-end="url(#report-arrow)">
            <path d="M143 156V235" />
            <path d="M226 239V160" />
        </g>
        <g fill="#e4edf9">
            <rect x="43" y="185" width="89" height="27" rx="8" />
            <rect x="238" y="185" width="74" height="27" rx="8" />
        </g>
        <g font-size="13" font-weight="700" text-anchor="middle" fill="#365779">
            <text x="87.5" y="203">Report fields</text>
            <text x="275" y="203">Selections</text>
        </g>

        <rect x="396" y="14" width="270" height="332" rx="16" fill="url(#network-surface)" stroke="#dbd3ec" />
        <text x="415" y="49" font-size="20" font-weight="700">Outbound connections</text>

        <g fill="#fff" stroke="#ddd5ed">
            <rect x="415" y="76" width="233" height="72" rx="12" />
            <rect x="415" y="160" width="233" height="72" rx="12" />
            <rect x="415" y="244" width="233" height="72" rx="12" />
        </g>

        <g fill="none" stroke="#7354ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M324 280H368V112" />
            <g marker-end="url(#outbound-arrow)">
                <path d="M368 112H411" />
                <path d="M368 196H411" />
                <path d="M368 280H411" />
            </g>
        </g>

        <rect x="429" y="92" width="40" height="40" rx="10" fill="#e7f4ff" />
        <image x="433" y="96" width="32" height="32" href="data:image/svg+xml;base64," />
        <rect x="429" y="176" width="40" height="40" rx="10" fill="#f1ebfb" />
        <g fill="none" stroke="#7354ac" stroke-width="1.55">
            <circle cx="449" cy="196" r="10" />
            <ellipse cx="449" cy="196" rx="4.2" ry="10" />
            <path d="M439 196H459" />
        </g>
        <rect x="429" y="260" width="40" height="40" rx="10" fill="#eef3fa" />
        <image x="433" y="264" width="32" height="32" href="data:image/svg+xml;base64," />

        <g font-size="17" font-weight="700">
            <text x="481" y="107">OKVIZ API</text>
            <text x="481" y="191">Configured hosts</text>
            <text x="481" y="275">My Storage</text>
        </g>
        <g font-size="13.5" fill="#475971">
            <text x="481" y="128">License and updates</text>
            <text x="481" y="212">Maps and linked assets</text>
            <text x="481" y="296">Maps and saved bindings</text>
        </g>
    </g>
</svg>
